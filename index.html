<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>何か決めるときのやつщ(ﾟДﾟщ)ｶﾓｰﾝ</title>

<style>

    body {
      font-family: sans-serif;
      width: 135%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
      font-size: 1.1rem; 
    }

    h1 {
      font-size: 1.8rem;
      margin: 8px 0;
      text-align: center;
    }

    h4 {
      font-size: 1.1rem;
      margin: 4px 0 12px 0;
      color: #555;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 160px;
      font-size: 1.1rem;
      padding: 8px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    #result {
      font-size: 3rem; 
      margin: 12px 0;
      text-align: center;
      min-height: 3.5rem;
      color: #e63946;
    }

    button {
      cursor: pointer;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
    }

    .main-button {
      display: block;
      width: 100%;
      font-size: 1.5rem;
      font-weight: bold;
      background-color: #333;
      color: #fff;
      border: none;
    }

    hr {
      margin: 20px 0;
      border: none;
      border-top: 2px solid #ccc;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header-container h2 {
      font-size: 1.4rem;
      margin: 0;
    }

    #historyList {
      margin: 0;
      padding-left: 24px;
      font-size: 1.2rem;
    }

    #historyList li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h1>なんか決めるときのやつ</h1>
  <h4>改行で区切ってくれよな！！</h4>

  <textarea id="userInput" rows="8" style="width: 300px; height: 200px">
大吉
吉
中吉
小吉
末吉
凶
大凶</textarea>

  <h3 id="result">？</h3>

  <button onclick="drawOmikuji()">押せ！！</button>

  <hr>
  <div class="header-container">
    <h2>履歴</h2>
    <button onclick="clearList()">履歴削除</button>
  </div>

  <style>
    .header-container{
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0px 12px;
    }
  </style>

  <ul id="historyList"></ul>

  <script>
    let history = [];

    function clearList(){
      history = [];
      
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
    }

    function drawOmikuji() {

      document.getElementById('result').textContent = '-';
      
      setTimeout(function(){
        const inputText = document.getElementById('userInput').value;
        const results = inputText
        .split('\n')
        .map(item => item.trim())
        .filter(item => item !== '');
        const randomIndex = Math.floor(Math.random() * results.length);
        const selectedResult = results[randomIndex];
        
        document.getElementById('result').textContent = results[randomIndex];
        
        history.unshift(selectedResult);

        const historyList = document.getElementById('historyList')
        historyList.innerHTML = '';

        history.forEach(function(item) {
          const li = document.createElement('li')
          li.textContent = item
          historyList.appendChild(li);
        });
      },300);
    }
  </script>

</body>
</html>
